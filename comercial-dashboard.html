<style>
  *{box-sizing:border-box}:root{color-scheme:light}
  body{margin:0;background:#eef1f4;color:#1f2d38;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body::before{content:"";position:fixed;top:0;left:0;right:0;height:4px;z-index:100;background:linear-gradient(90deg,#223c7e 0%,#223c7e 42%,#2ba9e0 42%,#2ba9e0 68%,#e1251b 68%,#e1251b 100%)}
  .wrap{max-width:1080px;margin:0 auto;padding:28px 18px 60px}
  .card{background:#fff;border:1px solid #e3e8ed;border-radius:16px;box-shadow:0 6px 20px rgba(31,45,56,.06)}
  .header{display:flex;align-items:center;gap:14px;padding:18px 22px;margin-bottom:16px}
  .header img{height:44px}.header h1{margin:0;font-size:19px;color:#223c7e;font-weight:800}.header p{margin:2px 0 0;font-size:13px;color:#94a1ab}
  select{font:inherit;background:#fff;border:1px solid #cfd6dd;border-radius:10px;padding:9px 12px;outline:none}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:16px 0}
  .kpi{padding:16px 18px}
  .kpi .lab{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#94a1ab;margin-bottom:6px}
  .kpi .val{font-size:26px;font-weight:800}
  .kpi .tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;margin-top:6px}
  .row{display:grid;grid-template-columns:1fr;gap:16px}
  @media(min-width:820px){.row{grid-template-columns:3fr 2fr}}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:7px 10px;border-bottom:1px solid #f1f4f7}th{color:#94a1ab;font-size:11px;text-transform:uppercase;text-align:left}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .bar{height:7px;border-radius:4px;background:#eef1f4;overflow:hidden;margin-top:3px}
  .muted{color:#94a1ab;font-size:12px}.sec{font-size:14px;font-weight:700;padding:14px 18px 0}
</style>
</head>

    <div style="flex:1"><h1>Tablero Comercial</h1><p>Facturación · cumplimiento presupuestario · ANAFER S.A.</p></div>
    <select id="unidad"></select>
  </div>
  <div id="estado" class="muted" style="padding:0 4px 8px">Cargando datos…</div>
  <div class="kpis" id="kpis"></div>
  <div class="row">
    <div class="card"><div class="sec">Evolución mensual (facturación)</div><div style="padding:6px 8px 14px"><table id="evol"></table></div></div>
    <div class="card"><div class="sec">Top productos (facturación)</div><div style="padding:6px 8px 14px"><table id="top"></table></div></div>
  </div>
</div>

<script>
const SUPABASE_URL="https://sjhonbjphfacajftptgg.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNqaG9uYmpwaGZhY2FqZnRwdGdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzOTMyNjUsImV4cCI6MjEwMzk2OTI2NX0.KdKps-zzoT0IRJGzuAGZg_EFJ6lXCzRsqf2pm81x_ew";
const H={apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY};
const MESES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const $=(id)=>document.getElementById(id);
const money=(n)=>'$'+Math.round(n).toLocaleString('es-AR');
const kmoney=(n)=>'$'+(n/1e6).toFixed(1)+'M';

let REF=[], REAL=[];
async function cargar(){
  try{
    const [r1,r2]=await Promise.all([
      fetch(SUPABASE_URL+'/rest/v1/comercial_referencia?select=*',{headers:H}).then(r=>r.json()),
      fetch(SUPABASE_URL+'/rest/v1/comercial_real?select=periodo,unidad,producto,venta_bruta,cantidad&limit=200000',{headers:H}).then(r=>r.json()),
    ]);
    REF=r1||[]; REAL=Array.isArray(r2)?r2:[];
    $("estado").textContent = REAL.length? `${new Set(REAL.map(x=>x.periodo)).size} mes(es) cargados desde la carga mensual · el resto viene del maestro` : "Mostrando datos del maestro (todavía no cargaste meses con la carga mensual)";
    const unidades=[...new Set(REF.map(r=>r.unidad))];
    $("unidad").innerHTML=unidades.map(u=>`<option>${u}</option>`).join('');
    render();
  }catch(e){ $("estado").textContent="No se pudo conectar con la base. ¿Corriste los SQL de comercial?"; }
}
$("unidad").onchange=render;

// real 2026 por mes para una unidad: usa la carga mensual (bruta) si el mes está cargado, si no el maestro
function realPorMes(unidad){
  const out=Array(12).fill(null);
  // maestro
  REF.filter(r=>r.unidad===unidad).forEach(r=> out[r.mes-1]=Number(r.real2026_monto)||0);
  // override con carga mensual
  const porMes={};
  REAL.filter(x=> unidad==='Compañía' || x.unidad===unidad).forEach(x=>{
    const m=new Date(x.periodo+'T00:00:00').getMonth();
    porMes[m]=(porMes[m]||0)+(Number(x.venta_bruta)||0);
  });
  Object.entries(porMes).forEach(([m,v])=> out[m]=v);
  return out;
}
function serie(unidad,campo){ const o=Array(12).fill(0); REF.filter(r=>r.unidad===unidad).forEach(r=>o[r.mes-1]=Number(r[campo])||0); return o; }

function render(){
  const u=$("unidad").value;
  const real=realPorMes(u), presu=serie(u,'presu_monto'), r2025=serie(u,'real2025_monto');
  const mesesReal=real.map((v,i)=>v!=null&&v>0?i:-1).filter(i=>i>=0);
  const n=mesesReal.length;
  const realAcum=mesesReal.reduce((s,i)=>s+real[i],0);
  const presuAcum=mesesReal.reduce((s,i)=>s+presu[i],0);
  const r2025Acum=mesesReal.reduce((s,i)=>s+r2025[i],0);
  const presuAnual=presu.reduce((a,b)=>a+b,0);
  const cumpl= presuAcum? realAcum/presuAcum*100 : 0;
  const crec= r2025Acum? (realAcum/r2025Acum-1)*100 : 0;
  const proy= n? realAcum/n*12 : 0;
  const okc=(v)=> v>=100;
  const tag=(txt,ok)=>`<span class="tag" style="background:${ok?'rgba(22,163,74,.12)':'rgba(225,37,27,.12)'};color:${ok?'#16a34a':'#e1251b'}">${txt}</span>`;

  $("kpis").innerHTML=[
    `<div class="card kpi"><div class="lab">Facturación real (acum)</div><div class="val">${kmoney(realAcum)}</div><div class="muted">${n} mes(es)</div></div>`,
    `<div class="card kpi"><div class="lab">Presupuesto (acum)</div><div class="val">${kmoney(presuAcum)}</div></div>`,
    `<div class="card kpi"><div class="lab">Cumplimiento</div><div class="val" style="color:${okc(cumpl)?'#16a34a':'#e1251b'}">${cumpl.toFixed(1)}%</div>${tag(okc(cumpl)?'En/sobre presupuesto':'Por debajo',okc(cumpl))}</div>`,
    `<div class="card kpi"><div class="lab">Crecimiento vs 2025</div><div class="val" style="color:${crec>=0?'#16a34a':'#e1251b'}">${crec>=0?'+':''}${crec.toFixed(1)}%</div></div>`,
    `<div class="card kpi"><div class="lab">Proyección cierre 2026</div><div class="val">${kmoney(proy)}</div><div class="muted">${presuAnual?(proy/presuAnual*100).toFixed(0):0}% del presup. anual</div></div>`,
  ].join('');

  // evolución
  const maxV=Math.max(...real.map(v=>v||0),...presu,1);
  let ev='<thead><tr><th>Mes</th><th class="num">Real</th><th class="num">Presup.</th><th class="num">Cumpl.</th></tr></thead><tbody>';
  for(let i=0;i<12;i++){
    if(!presu[i]&&!(real[i])) continue;
    const c= presu[i]? (real[i]||0)/presu[i]*100 : null;
    ev+=`<tr><td>${MESES[i]}</td><td class="num">${real[i]!=null?kmoney(real[i]):'—'}<div class="bar"><div style="width:${(real[i]||0)/maxV*100}%;height:100%;background:#223c7e"></div></div></td><td class="num">${kmoney(presu[i])}</td><td class="num" style="color:${c==null?'#94a1ab':c>=100?'#16a34a':'#e1251b'}">${c==null?'—':c.toFixed(0)+'%'}</td></tr>`;
  }
  $("evol").innerHTML=ev+'</tbody>';

  // top productos (de la carga mensual)
  const prod={};
  REAL.filter(x=> u==='Compañía' || x.unidad===u).forEach(x=>{ if(x.producto) prod[x.producto]=(prod[x.producto]||0)+(Number(x.venta_bruta)||0); });
  const top=Object.entries(prod).sort((a,b)=>b[1]-a[1]).slice(0,10);
  $("top").innerHTML = top.length? '<thead><tr><th>Producto</th><th class="num">Facturación</th></tr></thead><tbody>'+
    top.map(([p,v])=>`<tr><td>${p}</td><td class="num">${kmoney(v)}</td></tr>`).join('')+'</tbody>'
    : '<tbody><tr><td class="muted" style="padding:16px">Cargá meses con la carga mensual para ver el ranking de productos.</td></tr></tbody>';
}
cargar();
</script>
