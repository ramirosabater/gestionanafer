<style>
  *{box-sizing:border-box}:root{color-scheme:light}
  body{margin:0;background:#eef1f4;color:#1f2d38;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body::before{content:"";position:fixed;top:0;left:0;right:0;height:4px;z-index:100;background:linear-gradient(90deg,#223c7e 0%,#223c7e 42%,#2ba9e0 42%,#2ba9e0 68%,#e1251b 68%,#e1251b 100%)}
  .wrap{max-width:760px;margin:0 auto;padding:32px 20px 60px}
  .card{background:#fff;border:1px solid #e3e8ed;border-radius:18px;box-shadow:0 6px 20px rgba(31,45,56,.06);padding:22px;margin-bottom:18px}
  .header{display:flex;align-items:center;gap:14px}.header img{height:46px}
  .header h1{margin:0;font-size:20px;color:#223c7e;font-weight:800}.header p{margin:2px 0 0;font-size:13px;color:#94a1ab}
  h2{font-size:15px;margin:0 0 12px}
  .drop{border:2px dashed #cfd6dd;border-radius:14px;padding:26px;text-align:center;color:#5c6b78;cursor:pointer;transition:.15s}
  .drop:hover{border-color:#2ba9e0;background:#f6fbfe}
  button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:11px 16px;font-weight:700}
  .btn-red{background:#e1251b;color:#fff}
  table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid #f1f4f7}th{color:#94a1ab;font-size:11px;text-transform:uppercase}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .msg{font-size:13px;margin-top:10px}.ok{color:#16a34a}.err{color:#e1251b}
  .muted{color:#94a1ab;font-size:12px}.pill{display:inline-block;background:#f1f4f7;border:1px solid #e3e8ed;border-radius:8px;padding:3px 8px;font-size:12px}
</style>
</head>

    <div><h1>Comercial · Altas vs Bajas</h1><p>Subí el archivo mensual de altas y bajas de clientes</p></div>
  </div>
  <div class="card">
    <h2>1. Elegí el archivo del mes</h2>
    <p class="muted" style="margin-top:-4px">El archivo crudo de altas/bajas (.xls separado por punto y coma).</p>
    <div class="drop" id="drop">📄 Hacé clic o arrastrá el archivo acá</div>
    <input type="file" id="file" accept=".xls,.csv,.txt" hidden />
    <div id="preview"></div>
  </div>
  <div class="card">
    <h2>Meses ya cargados</h2>
    <div id="historial"><span class="muted">Cargando…</span></div>
  </div>
</div>
<script>
const SUPABASE_URL="https://sjhonbjphfacajftptgg.supabase.co";
const SUPABASE_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNqaG9uYmpwaGZhY2FqZnRwdGdnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgzOTMyNjUsImV4cCI6MjEwMzk2OTI2NX0.KdKps-zzoT0IRJGzuAGZg_EFJ6lXCzRsqf2pm81x_ew";
const H=()=>({apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"});
const UMAP={'FAMILIA':'Familia','NEGOCIO':'Negocios','NEGOCIOS':'Negocios','EMPRESA':'Empresas','EMPRESAS':'Empresas','DISTRIBUIDOR':'Distribuidores','DISTRIBUIDORES':'Distribuidores','REVENTA':'Reventa','SUCURSALES':'Sucursales','PERSONAL':'Personal'};
const $=(id)=>document.getElementById(id);
let parsed=null;

function parseArchivo(texto){
  const lineas=texto.split(/\r?\n/).filter(l=>l.trim());
  const agg={}; let fhastaRaw=null;
  for(let i=1;i<lineas.length;i++){
    const c=lineas[i].split(';'); if(c.length<7) continue;
    const [,fhasta,,,desc,cant,tipo]=c; fhastaRaw=fhasta;
    const u=UMAP[String(desc).trim().toUpperCase()]||String(desc).trim();
    const n=parseInt(cant,10)||0; const t=String(tipo).trim().toUpperCase();
    if(!agg[u]) agg[u]={altas:0,bajas:0};
    if(t==='ALTA') agg[u].altas+=n; else if(t==='BAJA') agg[u].bajas+=n;
  }
  let periodo=null; if(fhastaRaw){ const [d,m,y]=fhastaRaw.split('/'); periodo=`${y}-${m.padStart(2,'0')}-01`; }
  return { periodo, agg };
}
const mesNombre=(p)=> p? new Date(p+'T00:00:00').toLocaleDateString('es-AR',{month:'long',year:'numeric'}):'';

$("drop").onclick=()=>$("file").click();
$("drop").ondragover=(e)=>{e.preventDefault();$("drop").style.borderColor="#2ba9e0";};
$("drop").ondragleave=()=>$("drop").style.borderColor="#cfd6dd";
$("drop").ondrop=(e)=>{e.preventDefault();$("drop").style.borderColor="#cfd6dd";if(e.dataTransfer.files[0])leer(e.dataTransfer.files[0]);};
$("file").onchange=(e)=>{if(e.target.files[0])leer(e.target.files[0]);};
function leer(file){const r=new FileReader();r.onload=()=>{try{parsed=parseArchivo(r.result);mostrar();}catch(e){$("preview").innerHTML='<p class="msg err">No se pudo leer el archivo.</p>';}};r.readAsText(file,'utf-8');}

function mostrar(){
  if(!parsed||!parsed.periodo){$("preview").innerHTML='<p class="msg err">No se detectó el período.</p>';return;}
  const filas=Object.entries(parsed.agg).sort((a,b)=>(b[1].altas+b[1].bajas)-(a[1].altas+a[1].bajas));
  let ta=0,tb=0; filas.forEach(([,v])=>{ta+=v.altas;tb+=v.bajas;});
  const rows=filas.map(([u,v])=>{const neto=v.altas-v.bajas;return `<tr><td>${u}</td><td class="num">${v.altas}</td><td class="num">${v.bajas}</td><td class="num" style="color:${neto>=0?'#16a34a':'#e1251b'}">${neto>=0?'+':''}${neto}</td></tr>`;}).join('');
  $("preview").innerHTML=`
    <div style="margin-top:16px"><span class="pill">Período: <b>${mesNombre(parsed.periodo)}</b></span>
    <span class="pill">Altas: ${ta}</span><span class="pill">Bajas: ${tb}</span>
    <span class="pill">Neto: <b style="color:${ta-tb>=0?'#16a34a':'#e1251b'}">${ta-tb>=0?'+':''}${ta-tb}</b></span></div>
    <table><thead><tr><th>Unidad</th><th class="num">Altas</th><th class="num">Bajas</th><th class="num">Neto</th></tr></thead><tbody>${rows}</tbody></table>
    <div id="cargaMsg" class="msg"></div>
    <button class="btn-red" id="cargarBtn" style="margin-top:12px">Cargar ${mesNombre(parsed.periodo)} a la base</button>`;
  $("cargarBtn").onclick=cargar;
}

async function cargar(){
  if(!parsed) return; const btn=$("cargarBtn"); btn.disabled=true; btn.textContent="Cargando…"; const msg=$("cargaMsg");
  try{
    await fetch(`${SUPABASE_URL}/rest/v1/comercial_altas_bajas?periodo=eq.${parsed.periodo}`,{method:"DELETE",headers:H()});
    const rows=Object.entries(parsed.agg).map(([u,v])=>({periodo:parsed.periodo,unidad:u,altas:v.altas,bajas:v.bajas}));
    const res=await fetch(`${SUPABASE_URL}/rest/v1/comercial_altas_bajas`,{method:"POST",headers:{...H(),Prefer:"return=minimal"},body:JSON.stringify(rows)});
    if(!res.ok) throw new Error(await res.text());
    msg.className="msg ok"; msg.textContent=`✓ ${mesNombre(parsed.periodo)} cargado (${rows.length} unidades). Si ya existía, se reemplazó.`;
    btn.textContent="Cargado ✓"; cargarHistorial();
  }catch(e){ msg.className="msg err"; msg.textContent="No se pudo cargar: "+e.message; btn.disabled=false; btn.textContent="Reintentar"; }
}
async function cargarHistorial(){
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/comercial_altas_bajas_meses?select=*`,{headers:H()});
    const data=await res.json();
    if(!data.length){$("historial").innerHTML='<span class="muted">Todavía no hay meses cargados.</span>';return;}
    $("historial").innerHTML='<table><thead><tr><th>Mes</th><th class="num">Altas</th><th class="num">Bajas</th><th class="num">Neto</th></tr></thead><tbody>'+
      data.map(m=>`<tr><td style="text-transform:capitalize">${mesNombre(m.periodo)}</td><td class="num">${m.altas}</td><td class="num">${m.bajas}</td><td class="num" style="color:${m.neto>=0?'#16a34a':'#e1251b'}">${m.neto>=0?'+':''}${m.neto}</td></tr>`).join('')+'</tbody></table>';
  }catch(e){$("historial").innerHTML='<span class="err">No se pudo cargar el historial.</span>';}
}
cargarHistorial();
</script>
